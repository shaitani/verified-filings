# Curated business-term -> XBRL concept mappings: the accounting judgment the
# embedding search cannot supply.
#
# Read and validated by app/semantic/metric_aliases.py.
# Rationale and the rules for editing: app/semantic/DESIGN.md.
#
# How an entry is used
# --------------------
#   terms      one list per operand of `expression`. terms[0] is "c0", and so
#              on. Each list holds ALTERNATIVE concepts in preference order --
#              not a set to combine. The resolver walks them in order and takes
#              the first one that has facts covering the requested periods for
#              that specific company, which is how filer divergence resolves
#              itself: NVIDIA reports quarterly revenue under `Revenues` while
#              Apple and Microsoft use `RevenueFromContractWithCustomer...`,
#              and neither needs a per-company entry here.
#   expression arithmetic over the operands. Defaults to "c0". The SQL step
#              performs it; nothing here is ever evaluated in Python.
#   synonyms   extra surface forms. Matched after normalizing (lowercase,
#              collapse whitespace, drop punctuation), so "R&D" and "r & d"
#              both land on the same entry. Must be unique across the file.
#   clarify    set INSTEAD of `terms` when the business term is genuinely
#              several things. The entry then resolves to a question with named
#              choices rather than to concepts, and each choice points at
#              another metric here that does resolve. Use it where a default
#              would be quietly wrong rather than merely imprecise: "profit
#              margin" reads as net by convention, but gross and net differ by
#              twenty points on the same company, so guessing hands someone a
#              wrong answer with no signal. A specific name ("net profit
#              margin") still resolves straight through -- only the bare,
#              ambiguous term asks.
#
# Coverage measured across all 20 companies / 5 fiscal years, 2026-09-18. The
# company counts noted below are why some entries list several alternatives.

version: 1

metrics:
  # --- income statement -----------------------------------------------------
  revenue:
    label: Total revenue
    # 16 companies tag RevenueFromContractWithCustomer..., 10 tag Revenues.
    synonyms: [revenues, total revenue, net revenue, net revenues, sales, net sales, top line]
    terms:
      - - us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
        - us-gaap:Revenues
        - us-gaap:RevenueFromContractWithCustomerIncludingAssessedTax

  cost_of_revenue:
    label: Cost of revenue
    synonyms: [cost of sales, cost of goods sold, cogs, cost of products sold]
    terms:
      - - us-gaap:CostOfGoodsAndServicesSold
        - us-gaap:CostOfRevenue

  gross_profit:
    label: Gross profit
    # Only 9 of 20 report GrossProfit as a tagged line; the rest leave it to be
    # computed. Left as a single alternative deliberately -- an entry that
    # silently fell back to revenue-minus-cost would be a different number than
    # the filer's own subtotal.
    synonyms: [gross income]
    terms:
      - [us-gaap:GrossProfit]

  operating_income:
    label: Operating income
    synonyms: [operating profit, income from operations, operating earnings]
    terms:
      - [us-gaap:OperatingIncomeLoss]

  net_income:
    label: Net income
    # Bare "profit" and "bottom line" live on the `profit` clarify entry
    # instead: unqualified, they are not specifically net income.
    synonyms: [net earnings, net profit, net loss]
    terms:
      - - us-gaap:NetIncomeLoss
        - us-gaap:ProfitLoss

  research_and_development:
    label: Research and development expense
    # "r d" is what "R&D" and "R & D" both fold to now that punctuation
    # separates rather than vanishes. Before that they folded to "rd", which
    # nothing listed, so the commonest spelling of this metric missed the file
    # entirely and fell through to an embedding match that scored 0.699 --
    # one thousandth under the binding bar.
    # The "-ing"/"spend" forms were added 2026-09-22 from the first full eval
    # run: q008, q012 and q040 all ask about "R&D spending" or "R&D spend", and
    # all three fell past this entry into an embedding match that offered
    # ResearchAndDevelopmentExpense at 0.72 -- under the 0.75 bar, so the
    # question was refused for a term this file already knew.
    synonyms: [r d, r and d, rnd, research and development, research expense, r d expense,
               r d spending, r d spend, r d costs, research and development spending,
               research and development spend, research and development expense,
               r d investment, r d budget, research spending, research costs,
               development costs, research development]
    terms:
      - [us-gaap:ResearchAndDevelopmentExpense]

  sga_expense:
    label: Selling, general and administrative expense
    synonyms: [sg and a, sga, selling general and administrative, overhead]
    terms:
      - [us-gaap:SellingGeneralAndAdministrativeExpense]

  income_tax_expense:
    label: Income tax expense
    synonyms: [income taxes, tax expense, provision for income taxes]
    terms:
      - [us-gaap:IncomeTaxExpenseBenefit]

  stock_based_compensation:
    label: Share-based compensation
    synonyms: [stock compensation, share based compensation, sbc, stock comp]
    terms:
      - [us-gaap:ShareBasedCompensation]

  eps_diluted:
    label: Diluted earnings per share
    synonyms: [diluted eps, earnings per share diluted, diluted earnings per share]
    terms:
      - [us-gaap:EarningsPerShareDiluted]

  eps_basic:
    label: Basic earnings per share
    synonyms: [basic eps, earnings per share basic, basic earnings per share]
    terms:
      - [us-gaap:EarningsPerShareBasic]

  # --- balance sheet (instant facts; no Q4 arithmetic needed) ---------------
  total_assets:
    label: Total assets
    synonyms: [assets]
    terms:
      - [us-gaap:Assets]

  total_liabilities:
    label: Total liabilities
    synonyms: [liabilities]
    terms:
      - [us-gaap:Liabilities]

  shareholders_equity:
    label: Shareholders' equity
    synonyms: [stockholders equity, shareholders equity, total equity, book value]
    terms:
      - [us-gaap:StockholdersEquity]

  cash:
    label: Cash and cash equivalents
    # Deliberately NOT widened to include short-term investments. The filed
    # concept means what it says, and summing it with a securities line would
    # invent a subtotal no filer reports (DESIGN.md §7). The caveat carries the
    # difference instead, because for most large filers the excluded half is
    # the bigger one -- measured 2026-09-22 at each filer's latest instant.
    synonyms: [cash and equivalents, cash on hand, cash balance]
    terms:
      - [us-gaap:CashAndCashEquivalentsAtCarryingValue]
    caveats:
      us-gaap:CashAndCashEquivalentsAtCarryingValue: >-
        This is cash and cash equivalents only. Short-term investments and
        marketable securities are NOT included, and at this size they are
        usually the larger half: at FY2025 Microsoft held $30.2B of cash
        against $64.3B of short-term investments, and Alphabet $30.7B against
        $96.1B of marketable securities. Someone asking how much money the
        company has on hand is being shown roughly a third of it.

  inventory:
    label: Inventory
    synonyms: [inventories, stock on hand]
    terms:
      - [us-gaap:InventoryNet]

  goodwill:
    label: Goodwill
    synonyms: []
    terms:
      - [us-gaap:Goodwill]

  long_term_debt:
    label: Long-term debt
    synonyms: [long term debt, noncurrent debt]
    terms:
      - - us-gaap:LongTermDebtNoncurrent
        - us-gaap:LongTermDebt

  short_term_debt:
    label: Short-term debt
    # Both alternatives are genuine short-term borrowing totals: DebtCurrent
    # covers 9 filers, ShortTermBorrowings 6. LongTermDebtCurrent is wider (13)
    # and deliberately NOT listed -- it is the current maturities of long-term
    # debt, a *component*, so binding it would understate any filer that also
    # runs commercial paper. An honest refusal beats a low number.
    synonyms: [short term debt, current debt, current borrowings]
    terms:
      - - us-gaap:DebtCurrent
        - us-gaap:ShortTermBorrowings

  total_debt:
    label: Total debt
    # Ordered by how completely each alternative answers the phrase, which is
    # exactly what preference order is for -- and here the alternatives differ
    # in DEFINITION, not just in tag, so each fallback declares what it drops.
    #
    #   DebtLongtermAndShorttermCombinedAmount  4 filers, the real thing
    #   LongTermDebt                           17 filers, no commercial paper
    #   LongTermDebtNoncurrent                 13 filers, no current maturities
    #
    # Summing the components instead was measured and rejected: filers
    # double-tag the same balance under several concepts. At FY2025 JNJ reports
    # DebtCurrent and ShortTermBorrowings as the same $8.50B, INTC reports
    # DebtCurrent and LongTermDebtCurrent as the same $2.50B, and CVX's
    # DebtCurrent of $10.92B is not the sum of its own parts ($7.97B). Adding
    # them gives a different wrong answer per filer, which is also why
    # DESIGN.md §7 refuses computed subtotals generally.
    #
    # Measured: 17 of 20 bind, 4 of them to the exact combined line and so
    # with no caveat at all. The three that do not are each unresolved for a
    # different and correct reason -- NTGR carries no debt concept because it
    # carries no debt; CVX tags LongTermDebt but not for the window asked
    # about, so coverage drops it; JPM's only debt total in this store is
    # ShortTermBorrowings at $69B against a long-term load in the hundreds of
    # billions, so a chain reaching down to it would be off by roughly six
    # times. That last one is why no short-term concept is listed here.
    synonyms: [total borrowings, total indebtedness, combined debt]
    terms:
      - - us-gaap:DebtLongtermAndShorttermCombinedAmount
        - us-gaap:LongTermDebt
        - us-gaap:LongTermDebtNoncurrent
    caveats:
      us-gaap:LongTermDebt: >-
        This filer tags no combined debt total, so the figure shown is
        long-term debt including current maturities. Short-term borrowings and
        commercial paper are NOT included: Apple carried $8.0B of commercial
        paper outside its $90.7B of long-term debt at FY2025, so a number like
        this runs about 8% light.
      us-gaap:LongTermDebtNoncurrent: >-
        This filer tags neither a combined debt total nor an all-in long-term
        figure, so the figure shown is the NONCURRENT portion of long-term debt
        only. It excludes both current maturities and short-term borrowings,
        and so understates total debt by more than the long-term-debt fallback
        would.

  shares_outstanding:
    label: Common shares outstanding
    synonyms: [shares outstanding, common shares outstanding, share count]
    terms:
      - [us-gaap:CommonStockSharesOutstanding]

  # --- cash flow ------------------------------------------------------------
  operating_cash_flow:
    label: Net cash from operating activities
    synonyms: [cash from operations, operating cash flow, cash flow from operations, ocf]
    terms:
      - [us-gaap:NetCashProvidedByUsedInOperatingActivities]

  capital_expenditures:
    label: Capital expenditures
    # 14 filers tag PaymentsToAcquirePropertyPlantAndEquipment; AMZN, CVX, NVDA
    # and QCOM use the broader PaymentsToAcquireProductiveAssets instead.
    # Verified as real capex by value for their latest full years: AAPL 12.7B,
    # AMZN 131.8B, CVX 17.3B, NVDA 3.2B, QCOM 1.2B. BAC and JPM report no capex
    # concept at all -- banks do not conventionally present one.
    # The metric name itself indexes "capital expenditures"; the singular did
    # not, which is what q054 asks (2026-09-22 run).
    synonyms: [capex, capital spending, purchases of property and equipment,
               capital expenditure, capex spending, capex spend, capital spend]
    terms:
      - - us-gaap:PaymentsToAcquirePropertyPlantAndEquipment
        - us-gaap:PaymentsToAcquireProductiveAssets

  # --- derived: arithmetic over several concepts ----------------------------
  # Both of these carry `sign: magnitude` on the operand whose direction is
  # supplied by the operator rather than by the filer. Everything above is a
  # plain lookup where a negative value is information, not an error -- Micron
  # really did post negative gross profit in FY2023.
  gross_margin:
    label: Gross margin
    synonyms: [gross profit margin, gross margin percentage]
    expression: c0 / c1
    terms:
      # Numerator stays signed: a negative gross margin is a real answer.
      - [us-gaap:GrossProfit]
      # A negative denominator would invert the ratio into nonsense.
      - concepts:
          - us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
          - us-gaap:Revenues
        sign: magnitude

  free_cash_flow:
    label: Free cash flow
    synonyms: [fcf, free cash]
    expression: c0 - c1
    terms:
      # Operating cash flow is signed -- 7 of 20 filers post negative quarters.
      - [us-gaap:NetCashProvidedByUsedInOperatingActivities]
      # Same two alternatives as `capital_expenditures`, and for the same
      # reason: AMZN, CVX, NVDA and QCOM tag only the broader one. This slot
      # listed just the first until 2026-09-19, so "NVIDIA's free cash flow"
      # refused outright while "NVIDIA's capital expenditure" resolved -- the
      # two entries have to move together or they contradict each other.
      # Capex is tagged positive by every reporting filer and subtracted. A
      # negative one would make this add, inflating free cash flow silently.
      - concepts:
          - us-gaap:PaymentsToAcquirePropertyPlantAndEquipment
          - us-gaap:PaymentsToAcquireProductiveAssets
        sign: magnitude

  # --- added to close the gaps the eval questions exposed ------------------
  investing_cash_flow:
    label: Net cash from investing activities
    synonyms: [cash from investing, investing activities, cash used in investing]
    terms:
      - [us-gaap:NetCashProvidedByUsedInInvestingActivities]

  financing_cash_flow:
    label: Net cash from financing activities
    synonyms: [cash from financing, financing activities, cash used in financing]
    terms:
      - [us-gaap:NetCashProvidedByUsedInFinancingActivities]

  interest_expense:
    label: Interest expense
    # InterestExpense covers 17 filers; the fallbacks are narrower views of the
    # same cost. Deliberately NOT included: concepts like
    # UnrecognizedTaxBenefitsIncomeTaxPenaltiesAndInterestExpense, which are tax
    # footnote items that the embedding search kept surfacing instead.
    synonyms: [interest costs, interest on debt]
    terms:
      - - us-gaap:InterestExpense
        - us-gaap:InterestExpenseNonoperating
        - us-gaap:InterestExpenseDebt

  effective_tax_rate:
    label: Effective income tax rate
    # The filer's own reported rate, not one derived here. Filed under two
    # units across the corpus ("pure" and "Rate"), so the multi-unit guard
    # picks one and coverage may exclude filers using the other. PITFALLS 1.14.
    synonyms: [tax rate, effective rate, etr]
    terms:
      - [us-gaap:EffectiveIncomeTaxRateContinuingOperations]

  share_buybacks:
    label: Share repurchases
    # q053 asks for "share buyback spend" (2026-09-22 run). The plural
    # "share buybacks" resolves through the metric name; nothing else did.
    synonyms: [buybacks, share repurchase, stock buybacks, repurchase of common stock,
               share buyback, share buyback spend, buyback spend, stock repurchases,
               share repurchases]
    terms:
      - [us-gaap:PaymentsForRepurchaseOfCommonStock]

  dividends_per_share:
    label: Dividends declared per share
    # Declared is the headline figure; cash-paid is the fallback for filers
    # that tag only that.
    synonyms: [dividend per share, dps, per share dividend]
    terms:
      - - us-gaap:CommonStockDividendsPerShareDeclared
        - us-gaap:CommonStockDividendsPerShareCashPaid

  dividends_paid:
    label: Dividends paid
    synonyms: [total dividends, dividend payments, cash dividends paid]
    terms:
      - - us-gaap:PaymentsOfDividendsCommonStock
        - us-gaap:PaymentsOfDividends
        - us-gaap:DividendsCommonStockCash

  property_plant_and_equipment:
    label: Property, plant and equipment, net
    # "PP&E" on a balance sheet means net of accumulated depreciation -- that is
    # the presented line, and what 18 of 20 filers tag. Gross is a footnote
    # detail, kept as a fallback for filers that report only it.
    synonyms: [ppe, pp and e, property and equipment, fixed assets]
    terms:
      - - us-gaap:PropertyPlantAndEquipmentNet
        - us-gaap:PropertyPlantAndEquipmentGross

  current_assets:
    label: Total current assets
    synonyms: [current assets]
    terms:
      - [us-gaap:AssetsCurrent]

  current_liabilities:
    label: Total current liabilities
    synonyms: [current liabilities]
    terms:
      - [us-gaap:LiabilitiesCurrent]

  # --- ratios: numerator stays signed, denominator is a magnitude ----------
  operating_margin:
    label: Operating margin
    synonyms: [operating profit margin, operating margin percentage]
    expression: c0 / c1
    terms:
      - [us-gaap:OperatingIncomeLoss]
      - concepts:
          - us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
          - us-gaap:Revenues
        sign: magnitude

  rd_intensity:
    label: R&D intensity
    # Research and development as a share of revenue.
    #
    # Curated because the generic path cannot carry it. `QueryIn` is a flat
    # list of elements with no way to say "divide e3 by e2", so a question the
    # parser splits into two metric elements arrives as two independent asks
    # and the relationship survives only as English in `question`. Measured
    # 2026-09-23: "How much of Alphabet's revenue goes to R&D?" parses to
    # ['revenue', 'R&D'] and never reaches this entry, while "What is Apple's
    # R&D intensity?" parses to ['R&D intensity'] and does.
    #
    # So this entry fixes the NAMED ratio, not the phrased one. The general
    # case is app/retrieval/DESIGN.md §4.3d.
    synonyms: [r d intensity, research intensity, r d to revenue,
               r d revenue ratio, r d as a share of revenue,
               r d as a percentage of revenue]
    expression: c0 / c1
    terms:
      - [us-gaap:ResearchAndDevelopmentExpense]
      - concepts:
          - us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
          - us-gaap:Revenues
        sign: magnitude

  net_margin:
    label: Net profit margin
    synonyms: [net profit margin, net margin percentage, bottom line margin]
    expression: c0 / c1
    terms:
      - - us-gaap:NetIncomeLoss
        - us-gaap:ProfitLoss
      - concepts:
          - us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
          - us-gaap:Revenues
        sign: magnitude

  free_cash_flow_margin:
    label: Free cash flow margin
    synonyms: [fcf margin, cash flow margin]
    expression: (c0 - c1) / c2
    terms:
      - [us-gaap:NetCashProvidedByUsedInOperatingActivities]
      - concepts:
          - us-gaap:PaymentsToAcquirePropertyPlantAndEquipment
          - us-gaap:PaymentsToAcquireProductiveAssets
        sign: magnitude
      - concepts:
          - us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
          - us-gaap:Revenues
        sign: magnitude

  current_ratio:
    label: Current ratio
    synonyms: [working capital ratio, liquidity ratio]
    expression: c0 / c1
    terms:
      - [us-gaap:AssetsCurrent]
      - concepts: [us-gaap:LiabilitiesCurrent]
        sign: magnitude

  # --- understood, and genuinely not in this dataset: decline --------------
  # These resolve to a reason rather than to concepts. The point is to reach
  # the resolver BEFORE the embedding search does: left uncurated, market
  # questions did not fail safely. Measured 2026-09-19 -- "share price" bound
  # dei:EntityListingParValuePerShare outright at 0.726 and would have reported
  # $0.000006 as Microsoft's share price, and "stock price" put
  # CommonStockParOrStatedValuePerShare at 0.733, above the binding bar and
  # held back only by a second candidate happening to survive alongside it.
  stock_price:
    label: Share price
    synonyms: [share price, stock quote, share value, market price, price per share, quote]
    unavailable: >-
      Share prices are set by the market, not reported in a filing, so no XBRL
      concept carries one and this store has no price data at all. The nearest
      thing in it is par value (us-gaap:CommonStockParOrStatedValuePerShare or
      dei:EntityListingParValuePerShare), a legal formality often well under a
      cent, which is not a traded price. Answering this needs a market data
      source.

  market_cap:
    label: Market capitalisation
    synonyms: [market capitalization, market capitalisation, market value, mkt cap]
    unavailable: >-
      Market capitalisation is share price times shares outstanding, and share
      prices are not in XBRL. dei:EntityPublicFloat is filed by all 20 companies
      here and is NOT market cap -- it counts only shares held by non-affiliates
      and is measured on a single date each year. Answering this needs a market
      data source.

  segment_revenue:
    label: Revenue by segment or geography
    synonyms:
      - international revenue
      - foreign revenue
      - overseas revenue
      - domestic revenue
      - revenue by segment
      - revenue by geography
      - geographic revenue
      - revenue by region
      - revenue by product
      - product revenue
      - business segment revenue
    unavailable: >-
      The SEC's XBRL data endpoint returns only undimensioned consolidated
      facts -- measured, zero dimensional facts in this store -- so revenue
      split by segment, product or geography is not here at all. The
      consolidated revenue line is the only revenue figure available, and
      reporting it as a segment's revenue would be wrong rather than
      approximate. Answering this needs the segment axis from the filing's own
      XBRL.

  gross_revenue:
    label: Gross revenue
    # Deliberately not mapped to anything for years, on the grounds that there
    # is nothing honest to map it to -- but "not mapped" is not the same as
    # "declined". Left unlisted it fell to the embedding net, which offered
    # GrossProfit at 0.812: revenue minus cost of revenue, a different line
    # that is smaller than revenue rather than larger, which is the opposite of
    # what someone asking for a *gross* figure expects.
    synonyms: [gross sales, gross revenues, total gross revenue]
    unavailable: >-
      US GAAP has no gross-versus-net revenue pair. The revenue a filer tags is
      already net of returns, allowances and discounts, so there is no separate
      gross figure to report. Note that "gross profit" is a different line
      entirely -- revenue minus the cost of producing it -- and is not a gross
      revenue. Ask for revenue, or for gross profit, by name.

  # --- genuinely several things: ask rather than guess ---------------------
  profit_margin:
    label: Profit margin
    # Convention says an unqualified "profit margin" means NET margin, but on
    # one company gross and net routinely differ by twenty points, so a silent
    # default is a wrong answer with no signal. All three specific names
    # resolve directly; only the bare term asks.
    synonyms: [margin, margins, profitability]
    clarify:
      question: Which profit margin do you mean? They can differ by twenty points or more on the same company.
      options:
        - metric: gross_margin
          description: Revenue minus the direct cost of producing it. Shows pricing power and production efficiency.
        - metric: operating_margin
          description: Profit after operating costs but before interest and tax. Shows whether the core business works.
        - metric: net_margin
          description: What is left after everything, including interest and tax. The conventional reading of a bare "profit margin".

  profit:
    label: Profit
    synonyms: [earnings, bottom line]
    clarify:
      question: Which profit figure do you mean?
      options:
        - metric: gross_profit
          description: Revenue minus cost of revenue, before operating expenses.
        - metric: operating_income
          description: Profit from operations, before interest and tax.
        - metric: net_income
          description: Profit after all expenses, interest and tax.

  debt:
    label: Debt
    # Only the BARE term asks. "Total debt" is specific and resolves above,
    # disclosing what its fallbacks omit rather than making someone choose.
    # Left uncurated this was the worst case in the eval set: nineteen separate
    # ambiguity records for one phrase, offering DebtInstrumentCarryingAmount
    # (a per-instrument footnote line) among the choices.
    synonyms: [borrowings, indebtedness, debt load]
    clarify:
      question: Which debt figure do you mean? Most filers here report the halves rather than a combined total.
      options:
        - metric: total_debt
          description: Everything owed. Uses the filer's own combined line where there is one, and otherwise long-term debt, saying what that leaves out.
        - metric: long_term_debt
          description: Borrowings due more than a year out. The largest piece for most companies, and the most widely reported.
        - metric: short_term_debt
          description: Borrowings due within a year, such as commercial paper and revolver draws.

  cash_flow:
    label: Cash flow
    synonyms: [cashflow]
    clarify:
      question: Which cash flow do you mean?
      options:
        - metric: operating_cash_flow
          description: Cash generated by the business itself.
        - metric: investing_cash_flow
          description: Cash spent on or raised from assets and investments.
        - metric: financing_cash_flow
          description: Cash from borrowing, repayment, buybacks and dividends.
        - metric: free_cash_flow
          description: Operating cash flow minus capital expenditure.

  # --- terms that name no figure at all --------------------------------------
  performance:
    label: Performance
    # Not an accounting term in any sense: "strongest quarter", "performed
    # best", "how did they do" name no line of any statement. Left uncurated
    # they fall to the embedding search, and measured 2026-09-21 that search
    # returned nothing usable -- "strongest" and "best" both came back
    # `unresolved` against Costco, which is a dead end with nothing to offer
    # the person who asked.
    #
    # It asks rather than declines because the question is a perfectly
    # reasonable one: whoever typed it has a figure in mind and simply has not
    # said which. A default would be quietly wrong in the way `clarify` exists
    # for -- Costco's strongest quarter by revenue and by margin are not
    # obliged to be the same quarter.
    synonyms:
      [
        strongest, weakest, strength, best, worst, performed, performed best,
        did well, doing, how did they do, do, did, perform,
      ]
    clarify:
      question: Measured by what? "Strongest" and "best" can mean quite different things on the same company.
      options:
        - metric: revenue
          description: Total sales. The usual reading of a "big" or "strong" quarter.
        - metric: net_income
          description: Profit after everything, including interest and tax. The usual reading of "did well".
        - metric: operating_income
          description: Profit from the core business, before interest and tax.
        - metric: gross_margin
          description: Share of revenue left after the direct cost of production. Strength in the sense of pricing power.
