<mat-card class="panel" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Create an account</mat-card-title>
    <mat-card-subtitle>By invitation: use the email your code was issued for.</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="new-password" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Invite code</mat-label>
        <input
          matInput
          formControlName="inviteCode"
          autocomplete="off"
          placeholder="XXXX-XXXX-XXXX"
        />
      </mat-form-field>

      @if (problem(); as sentence) {
        <p class="problem" role="alert">{{ sentence }}</p>
      }

      <button mat-flat-button type="submit" [disabled]="busy() || form.invalid">
        Create account
      </button>
    </form>
  </mat-card-content>

  <mat-card-actions>
    <a mat-button routerLink="/login">Already have an account? Sign in</a>
  </mat-card-actions>
</mat-card>
