<mat-card class="panel" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Sign in</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="username" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </mat-form-field>

      @if (problem(); as sentence) {
        <p class="problem" role="alert">{{ sentence }}</p>
      }

      <button mat-flat-button type="submit" [disabled]="busy() || form.invalid">Sign in</button>
    </form>

    <p class="or">or</p>
    <button mat-stroked-button type="button" [disabled]="busy()" (click)="withGitHub()">
      Sign in with GitHub
    </button>
  </mat-card-content>

  <mat-card-actions>
    <a mat-button routerLink="/register">Have an invite code? Create an account</a>
  </mat-card-actions>
</mat-card>
