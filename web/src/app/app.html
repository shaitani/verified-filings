<mat-toolbar>
  <span>Verified Filings</span>
  <span class="spacer"></span>
  @if (auth.user(); as user) {
    <span class="who">{{ user.email }}</span>
    <button mat-button type="button" (click)="signOut()">Sign out</button>
  }
</mat-toolbar>

<main>
  <router-outlet />
  <p class="server">
    Web Server:
    @if (health.isLoading()) {
      checking…
    } @else if (health.hasValue()) {
      {{ health.value()['status'] }}
    } @else {
      unreachable
    }
  </p>
</main>
