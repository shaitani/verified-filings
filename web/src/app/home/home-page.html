<h1 class="lead">What do you want to know?</h1>
<p class="sub">Ask in plain English. Every figure comes back with its source filing.</p>

<form class="ask" [formGroup]="form" (ngSubmit)="ask()">
  <div class="composer">
    <textarea
      matInput
      cdkTextareaAutosize
      cdkAutosizeMinRows="2"
      cdkAutosizeMaxRows="10"
      formControlName="question"
      aria-label="Ask about the filings"
      placeholder="Ask about the filings, e.g. What was Apple's revenue in fiscal 2024?"
      (keydown.enter)="onEnter($event)"
    ></textarea>
    <button
      mat-icon-button
      class="send"
      type="submit"
      aria-label="Ask"
      [disabled]="busy() || form.invalid"
    >
      <mat-icon svgIcon="arrow_upward" />
    </button>
  </div>

  @if (problem(); as sentence) {
    <p class="problem" role="alert">{{ sentence }}</p>
  }
</form>
