# Eval set: questions a person might actually ask this system.
#
# Purpose: measure what real questions REQUIRE, so decisions about the SQL
# layer rest on a distribution rather than on anyone's intuition. Specifically
# open: how much of the work is plain retrieval versus aggregation, ranking or
# arithmetic the plan does not describe.
#
# Written before the SQL emitter exists and deliberately NOT shaped to what the
# mapper can currently do -- a question that should be refused is as valuable
# as one that should work. See evals/README.md for the tag vocabulary and how
# to add your own.
#
# Nothing here is a fixture. Expected answers are not recorded, because the
# point is the shape of the question, not the number.

version: 1

questions:
  # --- plain lookup ---------------------------------------------------------
  - id: q001
    question: What was Apple's revenue in fiscal 2024?
    expect: answerable
    needs: [retrieval]

  - id: q002
    question: How much cash did Microsoft have at the end of its last fiscal year?
    expect: answerable
    needs: [retrieval]
    exercises: [instant_fact]

  - id: q003
    question: What was NVIDIA's net income last year?
    expect: answerable
    needs: [retrieval]

  - id: q004
    question: How much did Intel spend on research and development in 2023?
    expect: answerable
    needs: [retrieval]

  - id: q005
    question: What were Costco's total assets at the most recent year end?
    expect: answerable
    needs: [retrieval]
    exercises: [instant_fact]

  # --- comparison between companies ----------------------------------------
  - id: q006
    question: Which had higher revenue in fiscal 2024, Apple or Microsoft?
    expect: answerable
    needs: [retrieval, ranking]
    exercises: [fiscal_calendar]
    notes: >-
      Their fiscal years end three months apart, so "fiscal 2024" is not the
      same window. PITFALLS 1.3 -- the plan exposes this but nothing warns.

  - id: q007
    question: Compare gross margins for Intel and AMD over the last three years.
    expect: answerable
    needs: [retrieval, ratio]
    exercises: [derived_metric]

  - id: q008
    question: How does Tesla's R&D spending compare to Meta's?
    expect: answerable
    needs: [retrieval]

  - id: q009
    question: Which of these companies has the highest operating margin?
    expect: answerable
    needs: [retrieval, ratio, ranking]
    exercises: [derived_metric]
    notes: >-
      `operating_margin` now resolves to OperatingIncomeLoss / revenue.
      OperatingIncomeLoss covers 16 of 20 filers, so a ranking is over a
      subset.

  # --- trend and growth -----------------------------------------------------
  - id: q010
    question: How fast has NVIDIA's revenue grown over the past five years?
    expect: answerable
    needs: [retrieval, growth]

  - id: q011
    question: What was Tesla's year-over-year revenue growth in 2024?
    expect: answerable
    needs: [retrieval, growth]

  - id: q012
    question: Has Intel's R&D spending increased or decreased since 2021?
    expect: answerable
    needs: [retrieval, growth]

  - id: q013
    question: Show me Apple's revenue trend for the last five years.
    expect: answerable
    needs: [retrieval]

  - id: q014
    question: Which company grew revenue fastest between 2023 and 2024?
    expect: answerable
    needs: [retrieval, growth, ranking]

  - id: q015
    question: Show me every company whose gross margin fell three years running.
    expect: answerable
    needs: [retrieval, growth, multi_step]
    notes: A filter over a computed sequence, not over a stored value.

  # --- quarterly, including the quarter nobody files ------------------------
  - id: q016
    question: What was Apple's Q4 revenue last year?
    expect: answerable
    needs: [retrieval]
    exercises: [q4_residual]

  - id: q017
    question: Compare Q4 revenue across Apple, Microsoft and NVIDIA.
    expect: answerable
    needs: [retrieval]
    exercises: [q4_residual, fiscal_calendar]
    notes: >-
      Three different calendar quarters under one label (Jun-Sep, Apr-Jun,
      Oct-Jan). PITFALLS 3.6 -- nothing warns that the comparison is uneven.

  - id: q018
    question: Which quarter is Costco's strongest?
    expect: answerable
    needs: [retrieval, ranking]
    exercises: [q4_residual]

  - id: q019
    question: What was Microsoft's operating cash flow in Q2 of fiscal 2024?
    expect: answerable
    needs: [retrieval]

  - id: q020
    question: How much did Apple's revenue change from Q3 to Q4 last year?
    expect: answerable
    needs: [retrieval, growth]
    exercises: [q4_residual]

  # --- ratios and derived metrics -------------------------------------------
  - id: q021
    question: What is Microsoft's free cash flow margin?
    expect: answerable
    needs: [retrieval, ratio]
    exercises: [derived_metric]
    notes: >-
      `free_cash_flow_margin` now resolves as (operating cash flow - capex) /
      revenue, a three-operand expression.

  - id: q022
    question: What is Apple's current ratio?
    expect: answerable
    needs: [retrieval, ratio]
    exercises: [derived_metric]
    notes: >-
      `current_ratio` now resolves to AssetsCurrent / LiabilitiesCurrent, both
      loaded for 18 of 20 filers.

  - id: q023
    question: How much of Alphabet's revenue goes to R&D?
    expect: answerable
    needs: [retrieval, ratio]

  - id: q024
    question: What was NVIDIA's free cash flow in fiscal 2025?
    expect: answerable
    needs: [retrieval]
    notes: >-
      Was unresolved: NVIDIA is one of six filers not using
      PaymentsToAcquirePropertyPlantAndEquipment. The capex alias now also
      lists PaymentsToAcquireProductiveAssets, covering NVDA, AMZN, CVX and
      QCOM. BAC and JPM still have no capex concept at all.

  # --- known data hazards ---------------------------------------------------
  - id: q025
    question: Show Alphabet's revenue from 2021 through 2025.
    expect: answerable
    needs: [retrieval]
    exercises: [concept_drift]
    notes: >-
      Alphabet switches revenue concepts at FY2025. Should return the full
      series WITH the concept_switch note attached. PITFALLS 1.8.

  - id: q026
    question: Did any of these companies restate its revenue?
    expect: refuse
    blocked_by: [restatement_metadata]
    notes: >-
      1,575 periods carry more than one value, but is_latest hides them and
      nothing exposes that a restatement happened. PITFALLS 2.2.

  - id: q027
    question: What was Micron's gross margin in fiscal 2023?
    expect: answerable
    needs: [retrieval, ratio]
    notes: Genuinely negative. Must not be "corrected" or refused.

  - id: q028
    question: What was Apple's revenue in 2015?
    expect: refuse
    blocked_by: [out_of_scope_period]
    notes: Store holds fiscal 2021-2025 only.

  - id: q029
    question: What was Apple's revenue in 2019?
    expect: partial
    needs: [retrieval]
    blocked_by: [out_of_scope_period]
    notes: >-
      Outside the loaded fiscal years, but comparative columns mean some 2019
      period_ends do exist. Whether to answer from a comparative is an open
      question -- flagging it rather than deciding it here.

  # --- should be refused ----------------------------------------------------
  - id: q030
    question: How much revenue did Apple make from iPhones?
    expect: refuse
    blocked_by: [segment_data]
    notes: PITFALLS 3.2 -- companyfacts carries no dimensional facts at all.

  - id: q031
    question: How much of Microsoft's revenue came from outside the United States?
    expect: refuse
    blocked_by: [segment_data]

  - id: q032
    question: What does Intel say about competition risk in its latest 10-K?
    expect: refuse
    blocked_by: [filing_text]

  - id: q033
    question: Why did Intel's margins fall in 2023?
    expect: refuse
    blocked_by: [causal, filing_text]

  - id: q034
    question: How many employees does Amazon have?
    expect: refuse
    blocked_by: [not_in_dataset]
    notes: EntityNumberOfEmployees is not present in the store.

  - id: q035
    question: What is NVIDIA's market capitalisation?
    expect: refuse
    blocked_by: [not_in_dataset]
    notes: >-
      EntityPublicFloat exists for all 20 filers and is NOT market cap. A
      plausible wrong binding -- worth checking the resolver does not make it.

  - id: q036
    question: How does Apple compare to Samsung on revenue?
    expect: partial
    blocked_by: [company_not_loaded]
    notes: Apple resolves, Samsung does not. Should answer half and say so.

  - id: q037
    question: What is Tesla's stock price today?
    expect: refuse
    blocked_by: [not_in_dataset]

  # --- awkward shapes -------------------------------------------------------
  - id: q038
    question: Which company had the largest single-quarter revenue decline?
    expect: answerable
    needs: [retrieval, growth, ranking, aggregation]
    exercises: [q4_residual]

  - id: q039
    question: List companies with more than 100 billion dollars in revenue last year.
    expect: answerable
    needs: [retrieval, multi_step]
    notes: A filter on the value itself rather than on a coordinate.

  - id: q040
    question: What was the average R&D spend across these companies in 2024?
    expect: answerable
    needs: [retrieval, aggregation, cross_company_total]

  - id: q041
    question: Show me Apple's revenue and net income side by side for five years.
    expect: answerable
    needs: [retrieval]
    notes: Two metric elements, one company, many periods.

  - id: q042
    question: Has anyone's total debt more than doubled since 2021?
    expect: answerable
    needs: [retrieval, growth, ranking, multi_step]

  # --- user provided -------------------------------------------------------
  - id: q043
    question: Show me visually how much money was made from 2023 to 2025 by quarter, for Google, Apple, and Nvidia
    expect: answerable
    shape: series
    needs: [retrieval]
    exercises: [q4_residual, fiscal_calendar, concept_drift]
    notes: >-
      The question that made `shape` a field. "Visually" is not decoration --
      it means 3 companies x 12 quarters = 36 points rather than one figure,
      and the plan has to say so or retrieval may collapse it. Also ambiguous
      on its face: "how much money was made" could be revenue or net income,
      which the producer has to pin down or the mapper will refuse it.
      Verified: resolves to 36 rows, 9 of them Q4 residuals, and 4 bindings
      because Alphabet changes revenue tags partway through the range.

  # --- user provided: templates. <Company> is substituted before running, so
  # --- these measure coverage of common asks rather than one concrete query.
  - id: q044
    question: "What is <Company>'s yearly revenue: gross, net"
    template: true
    expect: partial
    shape: table
    needs: [retrieval]
    notes: >-
      Net revenue binds cleanly. Gross revenue is still refused, and rightly:
      US GAAP has no gross-vs-net revenue pair, so there is nothing honest to
      map it to. Left uncurated on purpose.

  - id: q045
    question: "What is <Company>'s profit: net, gross"
    template: true
    expect: partial
    shape: table
    needs: [retrieval]
    notes: >-
      Both aliased. GrossProfit is only tagged by 9 of 20 filers, so this is
      complete for some companies and partial for others.

  - id: q046
    question: What is <Company>'s profit margin
    expect: partial
    needs: [retrieval, ratio]
    exercises: [derived_metric, clarification]
    notes: >-
      Deliberately ASKS rather than resolving. Convention reads a bare profit
      margin as net, but gross and net differ by twenty points or more on one
      company, so the plan returns a Clarification offering gross, operating
      and net with descriptions. Naming the margin resolves straight through.

  - id: q047
    question: "What is <Company>'s stock price, market cap"
    template: true
    expect: refuse
    blocked_by: [not_in_dataset]
    notes: >-
      Neither is in XBRL. EntityPublicFloat exists for all 20 filers and is NOT
      market cap -- the plausible wrong binding worth guarding against. Overlaps
      q035 and q037.

  - id: q048
    question: "What are <Company>'s quarterly revenues: gross, net"
    template: true
    expect: partial
    shape: table
    needs: [retrieval]
    exercises: [q4_residual]
    notes: Same gross/net problem as q044, plus Q4 has to be derived.

  - id: q049
    question: "Which companies in a given sector performed best: highest revenue, profit both quarterly and yearly"
    expect: answerable
    shape: ranking
    needs: [retrieval, ranking]
    exercises: [q4_residual, fiscal_calendar, mixed_granularity]
    notes: >-
      Was refused for want of data, not for want of code. The query path had
      been complete for a while -- CompanyGroupElementIn, the sic_* columns and
      _resolve_company_groups -- and the columns were simply empty, so the
      mapper said "SIC data has not been loaded" rather than returning an empty
      set that would have read as "no company is in that sector".
      app/db/loader.py now merges sic_numbers.json into the Company upsert,
      keyed on cik rather than ticker, and all 20 filers are populated.
      Verified for "semiconductors": resolves to AMD, INTC, MU and NVDA, 4
      companies x 5 periods x 2 metrics = 40 rows over 16 bindings, complete.
      "Both quarterly and yearly" is the part worth keeping: it is the only
      question here that mixes granularities, so the plan carries a
      mixed_granularity note alongside period_misalignment, and the Q4s split
      into their own residual bindings. q050, grouping by SIC office instead,
      is still correctly refused -- that column has no source at all.

  - id: q050
    question: "Which companies by sic office performed best: highest revenue, profit both quarterly and yearly"
    expect: refuse
    shape: ranking
    blocked_by: [sector_classification]
    notes: >-
      Same as q049, grouped by SIC office. Note sic_office has no source at all
      -- sic_numbers.json carries code and description only. The SEC assigns
      offices by SIC range, so it is derivable given that mapping, which this
      project does not have.

  - id: q051
    question: "What is <Company>'s cash flow: operating, investing, financing"
    template: true
    expect: partial
    shape: table
    needs: [retrieval]
    exercises: [clarification]
    notes: >-
      All three now aliased and resolving for all 20 filers. A bare cash flow
      asks which one is meant, since operating, investing, financing and free
      cash flow are four different answers.

  - id: q052
    question: "What are <Company>'s balance sheet totals: assets, liabilities, stockholders' equity, cash, goodwill, inventory"
    template: true
    expect: answerable
    shape: table
    needs: [retrieval]
    exercises: [instant_fact]
    notes: >-
      All six aliased, all instant facts. PP&E was removed from this question
      earlier; it is now aliased too, resolving to the Net figure, which is
      what a balance sheet line means, with Gross as a fallback. Coverage
      still varies by filer
      (Liabilities 15 of 20, StockholdersEquity 18, InventoryNet 17), so some
      companies will come back with fewer than six.

  - id: q053
    question: "What are <Company>'s shareholder returns: share buyback spend, dividends per share"
    template: true
    expect: answerable
    shape: table
    needs: [retrieval]
    notes: >-
      Both now aliased. share_buybacks covers 19 filers. Dividends split into
      two entries, dividends_per_share and dividends_paid, because a per-share
      figure and a cash total are different questions.

  - id: q054
    question: What is <Company>'s capital expenditure
    expect: partial
    needs: [retrieval]
    notes: >-
      Now 18 of 20 after adding PaymentsToAcquireProductiveAssets as an
      alternative. BAC and JPM report no capex concept at all.

  - id: q055
    question: What is <Company>'s interest expense
    expect: answerable
    needs: [retrieval]
    notes: >-
      Now aliased with an ordered fallback chain that resolves per filer: MSFT
      binds InterestExpense, TSLA falls back to InterestExpenseNonoperating,
      CVX to InterestExpenseDebt. Apple stopped tagging it after FY2023, so
      FY2024 is correctly unresolved for them.

  - id: q056
    question: What is <Company>'s effective tax rate
    expect: answerable
    needs: [retrieval]
    notes: >-
      Now aliased and resolving. Still the live case for PITFALLS 1.14: the
      concept is filed under two units, so the multi-unit guard binds one and
      filers using the other fall out of coverage.
