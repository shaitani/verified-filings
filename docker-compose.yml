services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: verified_filings
    # 127.0.0.1: reachable from this machine only. A bare "5432:5432" publishes
    # on every interface -- the local network, and on a server the internet,
    # where Docker's rules also bypass ufw. A deployment publishes none of these
    # ports; its web container reaches the database as db:5432.
    # Both loopbacks: Windows resolves "localhost" to ::1 first, and with only
    # 127.0.0.1 bound every connection waited ~2s for ::1 to be refused
    # (measured 2026-09-27: the test suite went from 25s to 7 minutes).
    ports: ["127.0.0.1:5432:5432", "[::1]:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    # So a cold start can wait for readiness instead of guessing. The very
    # first boot of an empty volume initialises the cluster and restarts it
    # once, so a plain "port is open" check can pass on a server that is
    # about to go away -- start_period covers that window. See BOOTSTRAP.md.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d verified_filings"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # Separate server, separate volume -- used only by tests/. Its own
  # POSTGRES_DB creates verified_filings_test on first boot, same as "db"
  # does for verified_filings. Fully isolated: safe to wipe its volume
  # anytime without touching real data.
  db-test:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: verified_filings_test
    ports: ["127.0.0.1:5433:5432", "[::1]:5433:5432"]  # this machine only, as db above
    volumes: ["pgdata-test:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d verified_filings_test"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: amospamo@proton.me      # login to the pgAdmin site
      PGADMIN_DEFAULT_PASSWORD: admin1234
    ports: ["127.0.0.1:5050:80", "[::1]:5050:80"]  # this machine only, as db above
    depends_on: [db, db-test]

  # Local embedding model server. Serves nomic-embed-text-v1.5 over Ollama's
  # HTTP API for concept-search embeddings -- nothing leaves the machine.
  # 11434 is Ollama's standard port.
  #
  # The image ships no models baked in, and `docker compose down -v` wipes the
  # "ollama-models" volume along with the database ones -- so the pull happens
  # here, on startup, rather than as a step in BOOTSTRAP.md that gets
  # forgotten. A forgotten pull surfaces as a connection-level error from the
  # embedder that looks nothing like a missing model.
  #
  # The pull runs in a background subshell that waits for the server to answer,
  # while `exec ollama serve` takes over PID 1 so signals still reach it and
  # `docker compose stop` stays fast. A one-shot "puller" service would do the
  # same job but leave an exited container behind after every `up`.
  #
  # Pulling a model already in the volume verifies its digest and returns in
  # about a second, so this costs nothing on a warm start.
  #
  # Two models, pulled in order of size so the small one is usable first:
  #   nomic-embed-text   274MB  concept-search embeddings (app/embedding_client.py)
  #   qwen2.5-coder:7b   4.7GB  writes SQL (app/retrieval/generator.py)
  # Both tags are also named in code; the code is authoritative and these have
  # to be kept in step with it.
  ollama:
    image: ollama/ollama:latest
    # This machine only: Ollama's API has no authentication, so anyone who can
    # reach it can run or pull models on this GPU.
    ports: ["127.0.0.1:11434:11434", "[::1]:11434:11434"]
    volumes: ["ollama-models:/root/.ollama"]
    # Without this the container cannot see the card at all and Ollama runs on
    # the CPU -- which is survivable for embeddings and is not for generation.
    # Docker Desktop already registers the "nvidia" runtime, so no NVIDIA
    # Container Toolkit install is needed; this line is the whole change.
    gpus: all
    entrypoint: ["/bin/sh", "-c"]
    # List form: a plain string is parsed as shell words by compose, and the
    # "&" does not survive that.
    command:
      - "( until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull nomic-embed-text; ollama pull qwen2.5-coder:7b ) & exec ollama serve"
    # Healthy means *usable*, not merely listening: both models have to be
    # there. On a cold start that means staying unhealthy for the length of a
    # 5GB download, which is the honest answer -- nothing downstream works
    # until then. The retry budget (60 x 5s) is sized for that, not for a
    # warm start, where the digest checks return in about a second.
    healthcheck:
      test:
        - CMD-SHELL
        - "ollama list 2>/dev/null | grep -q nomic-embed-text && ollama list 2>/dev/null | grep -q qwen2.5-coder"
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  # The Web Server ([B], app/api/). Built from ./api.Dockerfile; one worker, because
  # its job queue lives in the process (app/api/DESIGN.md §4).
  #
  # Credentials come from .env by name, below -- never the whole file. The owner
  # (superuser) login and the test database's never enter this container:
  # DATABASE_URL, which the code requires, is the web role's own here, so even an
  # accidental "owner" session has only vf_web_role's grants. DATABASE_HOST points
  # every database URL at "db" while keeping its login, so no password is written
  # twice (app/config.py).
  #
  # Behind the "web" profile, so the first `docker compose up -d` of BOOTSTRAP.md
  # does not start it before the migration and roles it needs exist. Start it
  # with `docker compose --profile web up -d`.
  api:
    profiles: ["web"]
    build:
      context: .                  # the repository root: what the build can see
      dockerfile: api.Dockerfile  # named, not the default "Dockerfile"
      args:
        CODE_VERSION: ${CODE_VERSION:-unknown}
    depends_on:
      db: {condition: service_healthy}
      ollama: {condition: service_healthy}
    environment:
      DATABASE_HOST: db:5432
      EMBEDDING_URL: http://ollama:11434
      DATABASE_URL: ${DATABASE_URL_WEB}
      DATABASE_URL_WEB: ${DATABASE_URL_WEB}
      DATABASE_URL_QUERY_MAPPER: ${DATABASE_URL_QUERY_MAPPER}
      DATABASE_URL_RETRIEVAL: ${DATABASE_URL_RETRIEVAL}
      AUTH_RESET_SECRET: ${AUTH_RESET_SECRET}
      AUTH_VERIFY_SECRET: ${AUTH_VERIFY_SECRET}
      AUTH_OAUTH_STATE_SECRET: ${AUTH_OAUTH_STATE_SECRET}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      # Where GitHub returns the browser: the Web Client's page (.env.example). The
      # fallback repeats app/config.py's default -- an empty value would override it.
      GITHUB_OAUTH_REDIRECT_URL: ${GITHUB_OAUTH_REDIRECT_URL:-http://localhost:8000/api/auth/github/callback}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-30}
    volumes: ["./data:/srv/data"]  # retrieval_log.jsonl survives the container
    ports: ["127.0.0.1:8000:8000", "[::1]:8000:8000"]  # this machine only, as db above
    healthcheck:
      test:
        - CMD
        - /srv/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  pgdata:
  pgdata-test:
  ollama-models:
