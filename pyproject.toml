[project]
name = "verified-filings"
version = "0.1.0"
description = "SEC filing retrieval and claim verification CLI"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "httpx>=0.27",
    "ollama>=0.6.2",
    "pglast>=8.4",
    "pgvector>=0.5.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.52",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
sec-retriever = "app.cli:main"

[tool.ruff]
line-length = 100
target-version = "py313"
# Alembic owns the style of everything under migrations/ (its env.py layout and
# the autogenerated version scripts). Don't lint/format it.
extend-exclude = ["app/db/migrations"]

[tool.ruff.lint]
# Pinned explicitly so the effective rule set doesn't drift when ruff
# changes its defaults between releases.
#   E, F  - pyflakes + pycodestyle (ruff's historical default)
#   I     - import sorting (isort)
#   UP    - pyupgrade: modernize syntax to the target-version floor (py313)
#   B     - flake8-bugbear: likely-bug patterns
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The producer's prompt is text a language model reads, and its line breaks
# are part of it: reflowing one worked example to satisfy E501 changed what
# the model emitted for an unrelated question. Formatting rules do not get a
# vote on prompt content.
"app/producer/prompt.py" = ["E501"]

[tool.ruff.lint.isort]
# Fold "import x as y" into the same "from x import ..." block instead of
# emitting a second statement for the renamed import.
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
